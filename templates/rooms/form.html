{% extends "base.html" %}
{% block title %}{{ action }} Room{% endblock %}
{% block breadcrumb %}<a href="{% url 'rooms:index' %}">Rooms</a><span class="sep">/</span><span class="current">{{ action }}</span>{% endblock %}

{% block content %}
<div style="max-width:600px;">
  <div style="margin-bottom:24px;">
    <div class="page-title">{{ action }} Room</div>
    <div style="color:var(--text-muted);font-size:13px;margin-top:4px;">Configure room details and capacity</div>
  </div>
  <form method="post">
    {% csrf_token %}
    <div class="card" style="margin-bottom:20px;">
      <div class="card-header"><div class="card-title">🚪 Room Configuration</div></div>
      <div class="card-body">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Room Number <span class="required">*</span></label>
            <input type="text" name="room_number" class="form-control" required placeholder="e.g. 101 or B-204" value="{{ room.room_number|default:'' }}">
          </div>
          <div class="form-group">
            <label class="form-label">Floor</label>
            <select name="floor" class="form-control">
              <option value="0" {% if room.floor == 0 %}selected{% endif %}>Ground Floor</option>
              <option value="1" {% if room.floor == 1 %}selected{% endif %}>First Floor</option>
              <option value="2" {% if room.floor == 2 %}selected{% endif %}>Second Floor</option>
              <option value="3" {% if room.floor == 3 %}selected{% endif %}>Third Floor</option>
              <option value="4" {% if room.floor == 4 %}selected{% endif %}>Fourth Floor</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Room Type</label>
            <select name="room_type" class="form-control">
              <option value="SINGLE" {% if room.room_type == 'SINGLE' %}selected{% endif %}>Single Occupancy</option>
              <option value="DOUBLE" {% if room.room_type == 'DOUBLE' %}selected{% endif %}>Double Occupancy</option>
              <option value="TRIPLE" {% if room.room_type == 'TRIPLE' %}selected{% endif %}>Triple Occupancy</option>
              <option value="DORM"   {% if room.room_type == 'DORM' %}selected{% endif %}>Dormitory (4+)</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Capacity <span class="required">*</span></label>
            <input type="number" name="capacity" class="form-control" min="1" max="20" required value="{{ room.capacity|default:'2' }}">
          </div>
          <div class="form-group">
            <label class="form-label">Monthly Rent (PKR)</label>
            <input type="number" name="monthly_rent" class="form-control" step="0.01" value="{{ room.monthly_rent|default:'0.00' }}">
          </div>
          <div class="form-group">
            <label class="form-label">Status</label>
            <label class="form-check" style="margin-top:10px;">
              <input type="checkbox" name="is_active" class="form-check-input" {% if action == 'Add' or room.is_active %}checked{% endif %}>
              <span>Room is active / usable</span>
            </label>
          </div>
          <div class="form-group form-full">
            <label class="form-label">Amenities</label>
            <textarea name="amenities" class="form-control" rows="3" placeholder="e.g. WiFi, AC, Attached Bathroom, Study Desk…">{{ room.amenities|default:'' }}</textarea>
          </div>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:10px;">
      <button type="submit" class="btn btn-primary">{% if action == 'Add' %}✓ Add Room{% else %}✓ Save Changes{% endif %}</button>
      <a href="{% url 'rooms:index' %}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
